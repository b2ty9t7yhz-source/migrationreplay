name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve project version
        id: project-version
        run: echo "value=$(./gradlew -q printVersion)" >> "$GITHUB_OUTPUT"

      - name: Run quality gates and build distribution
        run: ./gradlew clean check installDist distZip --dependency-verification=strict --no-daemon

      - name: Smoke test packaged CLI
        run: |
          ./build/install/migrationreplay/bin/migrationreplay --version
          ./build/install/migrationreplay/bin/migrationreplay validate build/install/migrationreplay/examples/add-user-email
          ./build/install/migrationreplay/bin/migrationreplay run build/install/migrationreplay/examples/add-user-email --output-dir build/ci-example-report

      - name: Verify intentional regression and SARIF contract
        run: |
          set +e
          ./build/install/migrationreplay/bin/migrationreplay run build/install/migrationreplay/examples/data-loss-regression --output-dir build/ci-data-loss-report
          replay_status=$?
          set -e
          test "$replay_status" -eq 1
          test "$(grep -c '"ruleId" : ' build/ci-data-loss-report/report.sarif)" -eq 5
          grep -q '"ruleId" : "QUERY_BEHAVIOR_CHANGED"' build/ci-data-loss-report/report.sarif
          grep -q '"ruleId" : "SCHEMA_ROUND_TRIP_MISMATCH"' build/ci-data-loss-report/report.sarif

      - name: Create distribution checksum
        working-directory: build/distributions
        run: |
          archive="migrationreplay-${{ steps.project-version.outputs.value }}.zip"
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload distribution and reports
        uses: actions/upload-artifact@v7
        with:
          name: migrationreplay-${{ steps.project-version.outputs.value }}
          path: |
            build/distributions/migrationreplay-${{ steps.project-version.outputs.value }}.zip
            build/distributions/migrationreplay-${{ steps.project-version.outputs.value }}.zip.sha256
            build/ci-example-report/report.json
            build/ci-example-report/report.md
            build/ci-example-report/report.sarif
            build/ci-data-loss-report/report.json
            build/ci-data-loss-report/report.md
            build/ci-data-loss-report/report.sarif
            build/reports/jacoco/test/html/
          if-no-files-found: error
